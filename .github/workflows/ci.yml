name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - name: Registry agent-docs HTTP gate
        run: |
          PORT=3456 npx tsx packages/marketplace/src/mcp-server.ts &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:3456/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "registry did not become healthy"
              exit 1
            fi
            sleep 0.25
          done
          npx tsx deploy/check-agent-docs.ts --base http://127.0.0.1:3456
